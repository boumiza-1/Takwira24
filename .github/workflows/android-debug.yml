name: Build Takwira24 Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Build web assets
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://ixadxgywnvlsjqscbntd.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_48Rd0dPSNde0hvkepsv28w_cfEClqZY
      - name: Generate Android project
        run: npx cap add android
      - name: Synchronize Capacitor
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Takwira24-Android-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
